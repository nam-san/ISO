{# 테이블 행별 수정/삭제 아이콘 버튼 매크로 (텍스트 없이 심플) #}
{% macro edit_link(url, title='수정') -%}
<a href="{{ url }}" class="icon-btn edit" title="{{ title }}" aria-label="{{ title }}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
</a>
{%- endmacro %}

{% macro delete_form(url, confirm='삭제하시겠습니까? 되돌릴 수 없습니다.', title='삭제') -%}
<form method="POST" action="{{ url }}" style="display:inline;" onsubmit="return confirm('{{ confirm }}');">
  <button type="submit" class="icon-btn delete" title="{{ title }}" aria-label="{{ title }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
  </button>
</form>
{%- endmacro %}
