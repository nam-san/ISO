{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block breadcrumb %}🔑 비밀번호 변경{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-title">비밀번호 변경 <span>Change Password</span></div>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline">← 대시보드</a>
</div>

<div style="max-width:480px;margin:0 auto;">
  <div class="card">
    <div class="card-header">🔑 새 비밀번호 설정</div>
    <div class="card-body">
      <form method="POST">
        <div class="form-group" style="margin-bottom:18px;">
          <label class="form-label">현재 비밀번호 <span style="color:var(--danger)">*</span></label>
          <input type="password" name="current_password" class="form-control" required
                 placeholder="현재 비밀번호를 입력하세요" autocomplete="current-password">
        </div>
        <div class="form-group" style="margin-bottom:18px;">
          <label class="form-label">새 비밀번호 <span style="color:var(--danger)">*</span></label>
          <input type="password" name="new_password" class="form-control" required
                 placeholder="8자 이상의 새 비밀번호" autocomplete="new-password" minlength="8">
        </div>
        <div class="form-group" style="margin-bottom:24px;">
          <label class="form-label">새 비밀번호 확인 <span style="color:var(--danger)">*</span></label>
          <input type="password" name="confirm_password" class="form-control" required
                 placeholder="새 비밀번호를 다시 입력하세요" autocomplete="new-password">
        </div>
        <div class="info-box" style="background:var(--iso-q-light);border:1px solid var(--iso-q);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:20px;font-size:0.82rem;color:var(--iso-q);">
          💡 비밀번호는 <strong>8자 이상</strong>이어야 합니다.
        </div>
        <div style="display:flex;gap:12px;justify-content:flex-end;">
          <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline">취소</a>
          <button type="submit" class="btn btn-primary">✓ 비밀번호 변경</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
