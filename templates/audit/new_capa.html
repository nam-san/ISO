{% extends "base.html" %}
{% block title %}시정조치(CAPA) 발행{% endblock %}
{% block breadcrumb %}⚡ 심사 관리 › 시정조치 (CAPA) › 발행{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <div class="page-title">시정 및 예방조치(CAPA) 요구서 발행</div>
    <div class="page-subtitle">심사 또는 일상 업무 중 도출된 부적합 사항에 대해 해결 및 방지 조치를 요청합니다.</div>
  </div>
  <a href="{{ url_for('audit.capa_list') }}" class="btn btn-secondary">
    <span>↩️ 목록으로</span>
  </a>
</div>

<div class="form-container" style="max-width: 700px; margin: 0 auto;">
  <div class="card-header">
    <h3 class="card-title">시정조치 요구 내용 입력</h3>
  </div>

  <form action="{{ url_for('audit.new_capa') }}" method="POST" class="standard-form">
    <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-md);">
      <div class="form-group">
        <label for="audit_id" class="form-label">관련 심사 계획</label>
        <select id="audit_id" name="audit_id" class="form-control">
          <option value="">-- 심사 외 수시 발행 --</option>
          {% for a in audits %}
          <option value="{{ a.id }}" {% if request.args.get('audit_id', type=int) == a.id %}selected{% endif %}>
            [{{ a.audit_number }}] {{ a.title }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="nc_type" class="form-label">부적합 구분 <span class="text-danger">*</span></label>
        <select id="nc_type" name="nc_type" class="form-control" required>
          <option value="major">중부적합 (Major)</option>
          <option value="minor" selected>경부적합 (Minor)</option>
          <option value="observation">관찰사항 (Observation)</option>
          <option value="improvement">개선권고 (Opportunity for Improvement)</option>
        </select>
      </div>
    </div>

    <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-md);">
      <div class="form-group">
        <label for="iso_clause" class="form-label">관련 ISO 표준 조항</label>
        <input type="text" id="iso_clause" name="iso_clause" class="form-control" placeholder="예: ISO 9001:2015 8.5.1">
      </div>

      <div class="form-group">
        <label for="due_date" class="form-label">조치 완료 예정일 <span class="text-danger">*</span></label>
        <input type="date" id="due_date" name="due_date" class="form-control" required>
      </div>
    </div>

    <div class="form-group">
      <label for="nc_description" class="form-label">부적합 현상 설명 <span class="text-danger">*</span></label>
      <textarea id="nc_description" name="nc_description" rows="3" class="form-control" required placeholder="발견된 문제점이나 부적합 증거를 구체적으로 적어주세요."></textarea>
    </div>

    <div class="form-group">
      <label for="root_cause" class="form-label">원인 분석</label>
      <textarea id="root_cause" name="root_cause" rows="2" class="form-control" placeholder="문제가 발생한 근본 원인을 작성합니다. (필요 시 조치 담당자가 사후 작성 가능)"></textarea>
    </div>

    <div class="form-group">
      <label for="corrective_action" class="form-label">시정 및 재발방지 대책</label>
      <textarea id="corrective_action" name="corrective_action" rows="3" class="form-control" placeholder="어떻게 개선하고 재발을 방지할 것인지 구체적인 실행 계획을 수립합니다."></textarea>
    </div>

    <div class="form-group">
      <label for="responsible_id" class="form-label">조치 담당자 <span class="text-danger">*</span></label>
      <select id="responsible_id" name="responsible_id" class="form-control" required>
        <option value="">-- 담당 임직원 선택 --</option>
        {% for u in users %}
        <option value="{{ u.id }}">{{ u.name }} ({{ u.department.name if u.department else '소속없음' }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-actions" style="margin-top: var(--spacing-lg); display: flex; justify-content: flex-end; gap: var(--spacing-sm);">
      <a href="{{ url_for('audit.capa_list') }}" class="btn btn-secondary">취소</a>
      <button type="submit" class="btn btn-primary">CAPA 요구서 발행</button>
    </div>
  </form>
</div>
{% endblock %}
